<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mc Donolds</title>
</head>

<body>
  <h1>IP Address Disclosure</h1>

  <p>
    By clicking the button below, you consent to your public IP address
    being sent to the site owner.
  </p>

  <button onclick="submitIP()">I Consent — Send My IP</button>

  <p id="result"></p>

  <script>
    async function submitIP() {
      try {
        const ipResponse = await fetch(
          "https://api.ipify.org?format=json"
        );

        const ipData = await ipResponse.json();

        const formData = new FormData();
        formData.append("ip_address", ipData.ip);

        const response = await fetch(
          "https://formspree.io/f/mnpadjyv",
          {
            method: "POST",
            body: formData,
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (response.ok) {
          document.getElementById("result").textContent =
            "Thank you. Your IP address has been submitted.";
        } else {
          document.getElementById("result").textContent =
            "There was a problem submitting the information.";
        }

      } catch (error) {
        document.getElementById("result").textContent =
          "Unable to submit the information.";
      }
    }
  </script>
</body>
</html>
