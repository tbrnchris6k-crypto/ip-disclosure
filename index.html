<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Disclosure</title>
</head>
<body>
  <h1>IP Address Disclosure</h1>

  <p>
    This page will display your public IP address.
    By continuing, you acknowledge that your IP address is being viewed.
  </p>

  <button onclick="showIP()">Show My IP Address</button>

  <p id="result"></p>

  <script>
    async function showIP() {
      const response = await fetch("https://api.ipify.org?format=json");
      const data = await response.json();
      document.getElementById("result").textContent =
        "Your public IP address is: " + data.ip;
    }
  </script>
</body>
</html>
